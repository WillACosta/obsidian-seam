name: Validate Plugin

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Validate Obsidian plugin
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: pr
          build: "false"
          scanner-lint: "true"
          strict: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}
