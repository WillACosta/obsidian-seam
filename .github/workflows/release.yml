name: Release Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Validate release consistency
        run: node scripts/changelog.mjs validate "${{ inputs.tag || github.ref_name }}"

      - name: Extract release notes
        run: node scripts/changelog.mjs extract "${{ inputs.tag || github.ref_name }}" --out release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
